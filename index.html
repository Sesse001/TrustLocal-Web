<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustLocal - Find Trusted Local Professionals</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1B5E20 0%, #2E7D32 50%, #4CAF50 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 80px;
            height: 80px;
            background: #2E7D32;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            overflow: hidden;
        }

        .logo img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
        }

        .app-name {
            font-size: 32px;
            font-weight: 700;
            color: #1F2937;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 16px;
            color: #6B7280;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #4B5563;
        }

        .feature-icon {
            font-size: 20px;
        }

        .download-button {
            display: inline-block;
            background: #2E7D32;
            color: white;
            padding: 16px 40px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .download-button:hover {
            background: #1B5E20;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .qr-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #E5E7EB;
        }

        .qr-text {
            font-size: 14px;
            color: #6B7280;
            margin-bottom: 12px;
        }

        .qr-image {
            width: 150px;
            height: 150px;
            border-radius: 12px;
            margin: 0 auto;
            display: block;
        }

        .footer-text {
            font-size: 12px;
            color: #9CA3AF;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="icon.png" alt="TrustLocal">
        </div>
        <h1 class="app-name">TrustLocal</h1>
        <p class="tagline">
            Connect with trusted local service providers in South Africa.
            Book, message, and review professionals near you.
        </p>

        <div class="features">
            <span class="feature">
                <span class="feature-icon">🔧</span> Verified Pros
            </span>
            <span class="feature">
                <span class="feature-icon">💬</span> Instant Chat
            </span>
            <span class="feature">
                <span class="feature-icon">⭐</span> Real Reviews
            </span>
        </div>

        <a href="https://github.com/Sesse001/TrustLocal/releases/download/v1.0.2/app-release.1.apk" class="download-button" id="downloadLink">
            📱 Download Now
        </a>

        <p class="footer-text">Available for Android | Free to use</p>

        <div class="qr-section">
            <p class="qr-text">Scan with your phone to download</p>
            <img src="qr-code.png" alt="Scan to download TrustLocal" class="qr-image">
        </div>
    </div>

    <script>
        console.log('TrustLocal landing page loaded');
    </script>
</body>
</html>
